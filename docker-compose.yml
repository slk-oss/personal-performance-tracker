version: '3.8'

services:
  # Сервис базы данных PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ppt_postgres_db
    restart: always
    
    # Автоматически подтягиваем значения из локального файла .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      
    # Внешний порт берется из .env, а внутренний порт контейнера всегда 5432
    ports:
      - "${POSTGRES_PORT}:5432"
      
    # Сохраняем данные на жестком диске MacBook
    volumes:
      - postgres_data:/var/lib/postgresql/data

# Именованное хранилище для персистентности данных
volumes:
  postgres_data:
